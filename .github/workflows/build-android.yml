name: build android apk

# Buildozer needs the Android SDK/NDK and takes ~40 minutes on a cold cache.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    # 24.04 dropped packages that p4a still expects; 22.04 builds cleanly.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev \
            libssl-dev libltdl-dev ccache

      # The SDK/NDK download and the python+numpy+ffmpeg builds dominate the
      # run time, so keep them between runs.
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build apk
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          # p4a creates a build venv and upgrades its pip. pip 26 rewrote
          # _internal.utils.logging, so the upgrade leaves that venv with a pip
          # that cannot import itself. Constraints apply to the upgrade too, so
          # the venv keeps a pip that works.
          PIP_CONSTRAINT: ${{ github.workspace }}/packaging/android/pip-constraints.txt
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython
          buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: LiveClip-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Attach the apk to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if [[ "$tag" != v* ]]; then
            tag="$(gh release list --limit 1 --json tagName -q '.[0].tagName')"
          fi
          if [ -z "$tag" ]; then
            echo "no release to attach to; the apk stays as a workflow artifact"
            exit 0
          fi
          gh release upload "$tag" bin/*.apk --clobber
