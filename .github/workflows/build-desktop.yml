name: build desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LiveClip-windows
          - os: macos-latest
            artifact: LiveClip-macos
          - os: ubuntu-latest
            artifact: LiveClip-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]" pyinstaller
          pip install kivy_deps.sdl2 kivy_deps.glew
        if: runner.os == 'Windows'

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]" pyinstaller
        if: runner.os != 'Windows'

      - name: Bundle ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libgl1-mesa-dri libmtdev1 libsdl2-2.0-0
          mkdir -p packaging/pyinstaller/bin
          cp "$(command -v ffmpeg)" "$(command -v ffprobe)" packaging/pyinstaller/bin/

      - name: Bundle ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          mkdir -p packaging/pyinstaller/bin
          cp "$(command -v ffmpeg)" "$(command -v ffprobe)" packaging/pyinstaller/bin/

      - name: Bundle ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/pyinstaller/bin | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist
          $exe = Get-ChildItem ffmpeg-dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $probe = Get-ChildItem ffmpeg-dist -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $exe.FullName packaging/pyinstaller/bin/ffmpeg.exe
          Copy-Item $probe.FullName packaging/pyinstaller/bin/ffprobe.exe

      # PyInstaller's Kivy hook imports Kivy to find submodules, which needs a
      # display even though the build is headless.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" \
            pyinstaller --noconfirm packaging/pyinstaller/liveclip.spec \
              --distpath dist --workpath build/pyinstaller

      - name: Build (Windows and macOS)
        if: runner.os != 'Linux'
        run: pyinstaller --noconfirm packaging/pyinstaller/liveclip.spec --distpath dist --workpath build/pyinstaller

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack archives
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$dir" && zip -qr "../${name}.zip" .)
          done
          ls -lh ./*.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
