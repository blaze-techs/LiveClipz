name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libgl1-mesa-dri libmtdev1
      - name: Install package
        run: pip install -e ".[dev,ui]"
      - name: Engine tests
        run: python -m pytest -q
      - name: Java helper compiles
        run: |
          sudo apt-get install -y default-jdk-headless
          curl -sL -o platform.zip \
            https://dl.google.com/android/repository/platform-33-ext3_r03.zip
          unzip -q platform.zip -d /tmp/android-platform
          javac -source 8 -target 8 \
            -bootclasspath /tmp/android-platform/android-13/android.jar \
            -d /tmp/java-out src/org/liveclip/ScreenCapture.java

      - name: UI builds headless
        run: |
          xvfb-run -a -s "-screen 0 900x1000x24" python -c "
          from autoclip.ui.app import LiveClipApp
          app = LiveClipApp()
          root = app.build()
          assert len(root.children) == 5
          print('ui ok')
          "
